<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1160" width="1400" height="1160" font-family="Arial, Helvetica, sans-serif">
  <style>
    .box { fill: #ffffff; stroke: #555; stroke-width: 2; }
    .soft { fill: #f2f2f2; stroke: #555; stroke-width: 2; }
    .dark { fill: #555; stroke: #555; stroke-width: 2; }
    .tag { fill: #ffffff; stroke: #555; stroke-width: 1.5; }
    .img { fill: #e6e6e6; stroke: #777; stroke-width: 1.5; }
    .x { stroke: #999; stroke-width: 1.5; }
    .field { fill: #ffffff; stroke: #777; stroke-width: 1.5; }
    .t { fill: #222; font-size: 15px; }
    .s { fill: #444; font-size: 13px; }
    .xs { fill: #666; font-size: 11px; font-style: italic; }
    .h1 { fill: #111; font-size: 30px; font-weight: bold; }
    .h2 { fill: #111; font-size: 19px; font-weight: bold; }
    .b { font-weight: bold; }
    .w { fill: #ffffff; font-size: 14px; font-weight: bold; }
    .note { fill: #7a3e9d; font-size: 13px; }
    .num { fill: #7a3e9d; }
    .numt { fill: #ffffff; font-size: 13px; font-weight: bold; }
  </style>

  <rect width="1400" height="1160" fill="#ffffff"/>
  <text x="40" y="32" class="h2" font-size="21">Boceto 2 · Catálogo (catalogo.html)</text>

  <rect x="40" y="50" width="1000" height="1090" class="box"/>

  <!-- HEADER -->
  <rect x="40" y="50" width="1000" height="80" class="soft"/>
  <rect x="60" y="70" width="150" height="40" class="box"/>
  <text x="80" y="96" class="t b">[logo] VitaMarket</text>
  <text x="600" y="96" class="t">Inicio</text>
  <text x="690" y="96" class="t b">Catálogo</text>
  <line x1="690" y1="103" x2="757" y2="103" stroke="#222" stroke-width="3"/>
  <text x="790" y="96" class="t">Carrito (2)</text>
  <text x="910" y="96" class="t">Acceder</text>

  <!-- TÍTULO -->
  <text x="60" y="180" class="h1">Catálogo de productos</text>

  <!-- BUSCADOR -->
  <text x="60" y="215" class="t b">Buscar productos</text>
  <rect x="60" y="225" width="560" height="40" class="field"/>
  <text x="72" y="250" class="xs">Ej.: proteína, pasta, avena…</text>
  <rect x="635" y="225" width="110" height="40" rx="6" class="dark"/>
  <text x="664" y="251" class="w">Buscar</text>

  <!-- AVISO PROTOTIPO -->
  <rect x="60" y="280" width="960" height="36" class="soft" stroke-dasharray="6 4"/>
  <text x="75" y="304" class="s b">⚠ Prototipo: la búsqueda, los filtros y la paginación todavía no modifican los resultados.</text>

  <!-- FILTROS (aside) -->
  <rect x="60" y="335" width="240" height="560" rx="6" class="box"/>
  <text x="78" y="365" class="h2">Filtrar productos</text>

  <rect x="74" y="380" width="212" height="200" rx="4" fill="none" stroke="#999" stroke-width="1.5"/>
  <rect x="86" y="370" width="110" height="20" fill="#ffffff"/>
  <text x="90" y="385" class="s b">Tipo de dieta</text>
  <rect x="90" y="402" width="14" height="14" class="field"/><text x="112" y="414" class="s">Vegano</text>
  <rect x="90" y="430" width="14" height="14" class="field"/><text x="112" y="442" class="s">Vegetariano</text>
  <rect x="90" y="458" width="14" height="14" class="field"/><text x="112" y="470" class="s">Sin gluten</text>
  <rect x="90" y="486" width="14" height="14" class="field"/><text x="112" y="498" class="s">Sin lactosa</text>
  <rect x="90" y="514" width="14" height="14" class="field"/><text x="112" y="526" class="s">Ecológico</text>
  <rect x="90" y="542" width="14" height="14" class="field"/><text x="112" y="554" class="s">Alto en proteína</text>

  <text x="78" y="615" class="s b">Categoría</text>
  <rect x="78" y="625" width="204" height="34" class="field"/>
  <text x="88" y="647" class="s">Todas las categorías ▾</text>

  <rect x="74" y="685" width="212" height="125" rx="4" fill="none" stroke="#999" stroke-width="1.5"/>
  <rect x="86" y="675" width="60" height="20" fill="#ffffff"/>
  <text x="90" y="690" class="s b">Precio</text>
  <circle cx="97" cy="717" r="7" class="field"/><text x="112" y="722" class="s">Hasta 5 €</text>
  <circle cx="97" cy="747" r="7" class="field"/><text x="112" y="752" class="s">De 5 a 15 €</text>
  <circle cx="97" cy="777" r="7" class="field"/><text x="112" y="782" class="s">Más de 15 €</text>

  <rect x="78" y="830" width="204" height="42" rx="6" class="dark"/>
  <text x="128" y="856" class="w">Aplicar filtros</text>

  <!-- RESULTADOS -->
  <text x="320" y="355" class="s">Mostrando 1–6 de 18 resultados</text>

  <!-- Tarjeta 1: con detalle -->
  <rect x="320" y="370" width="220" height="255" rx="8" class="box" stroke-width="3"/>
  <rect x="332" y="382" width="196" height="90" class="img"/>
  <line x1="332" y1="382" x2="528" y2="472" class="x"/><line x1="528" y1="382" x2="332" y2="472" class="x"/>
  <text x="332" y="495" class="t b">Proteína vegana 500 g</text>
  <rect x="332" y="505" width="78" height="22" rx="11" class="tag"/><text x="342" y="521" class="s">✓ Vegano</text>
  <rect x="416" y="505" width="100" height="22" rx="11" class="tag"/><text x="426" y="521" class="s">✓ Sin gluten</text>
  <text x="332" y="547" class="s">Guisante y arroz. 24 g de</text>
  <text x="332" y="563" class="s">proteína por ración.</text>
  <text x="332" y="585" class="t b">19,90 €</text>
  <rect x="420" y="570" width="108" height="28" rx="6" class="dark"/>
  <text x="433" y="589" class="w" font-size="13">Ver detalle</text>
  <text x="332" y="615" class="xs">Disponible</text>

  <!-- Tarjeta 2 -->
  <rect x="560" y="370" width="220" height="255" rx="8" class="box"/>
  <rect x="572" y="382" width="196" height="90" class="img"/>
  <line x1="572" y1="382" x2="768" y2="472" class="x"/><line x1="768" y1="382" x2="572" y2="472" class="x"/>
  <text x="572" y="495" class="t b">Pasta de lentejas 250 g</text>
  <rect x="572" y="505" width="100" height="22" rx="11" class="tag"/><text x="582" y="521" class="s">✓ Sin gluten</text>
  <rect x="678" y="505" width="78" height="22" rx="11" class="tag"/><text x="688" y="521" class="s">✓ Vegano</text>
  <text x="572" y="547" class="s">Solo harina de lentejas</text>
  <text x="572" y="563" class="s">rojas. Lista en 8 minutos.</text>
  <text x="572" y="585" class="t b">2,49 €</text>
  <text x="572" y="603" class="xs">Ficha no disponible en el prototipo</text>
  <text x="572" y="615" class="xs">Disponible</text>

  <!-- Tarjeta 3 -->
  <rect x="800" y="370" width="220" height="255" rx="8" class="box"/>
  <rect x="812" y="382" width="196" height="90" class="img"/>
  <line x1="812" y1="382" x2="1008" y2="472" class="x"/><line x1="1008" y1="382" x2="812" y2="472" class="x"/>
  <text x="812" y="495" class="t b">Bebida de avena 1 L</text>
  <rect x="812" y="505" width="105" height="22" rx="11" class="tag"/><text x="822" y="521" class="s">✓ Sin lactosa</text>
  <rect x="922" y="505" width="78" height="22" rx="11" class="tag"/><text x="932" y="521" class="s">✓ Vegano</text>
  <text x="812" y="547" class="s">Sin azúcares añadidos.</text>
  <text x="812" y="563" class="s">Enriquecida con calcio.</text>
  <text x="812" y="585" class="t b">1,89 €</text>
  <text x="812" y="603" class="xs">Ficha no disponible en el prototipo</text>
  <text x="812" y="615" class="xs">Disponible</text>

  <!-- Tarjeta 4 -->
  <rect x="320" y="645" width="220" height="255" rx="8" class="box"/>
  <rect x="332" y="657" width="196" height="90" class="img"/>
  <line x1="332" y1="657" x2="528" y2="747" class="x"/><line x1="528" y1="657" x2="332" y2="747" class="x"/>
  <text x="332" y="770" class="t b">Hamburguesa vegetal</text>
  <rect x="332" y="780" width="78" height="22" rx="11" class="tag"/><text x="342" y="796" class="s">✓ Vegano</text>
  <text x="332" y="822" class="s">De garbanzos y espinacas.</text>
  <text x="332" y="838" class="s">2 unidades.</text>
  <text x="332" y="860" class="t b">3,25 €</text>
  <text x="332" y="878" class="xs">Ficha no disponible en el prototipo</text>
  <text x="332" y="890" class="xs">Disponible</text>

  <!-- Tarjeta 5 -->
  <rect x="560" y="645" width="220" height="255" rx="8" class="box"/>
  <rect x="572" y="657" width="196" height="90" class="img"/>
  <line x1="572" y1="657" x2="768" y2="747" class="x"/><line x1="768" y1="657" x2="572" y2="747" class="x"/>
  <text x="572" y="770" class="t b">Barrita proteica 60 g</text>
  <rect x="572" y="780" width="128" height="22" rx="11" class="tag"/><text x="582" y="796" class="s">✓ Alto en proteína</text>
  <text x="572" y="822" class="s">Cacao y cacahuete.</text>
  <text x="572" y="838" class="s">20 g de proteína.</text>
  <text x="572" y="860" class="t b">1,50 €</text>
  <text x="572" y="878" class="xs">Ficha no disponible en el prototipo</text>
  <text x="572" y="890" class="xs">Pocas unidades</text>

  <!-- Tarjeta 6 -->
  <rect x="800" y="645" width="220" height="255" rx="8" class="box"/>
  <rect x="812" y="657" width="196" height="90" class="img"/>
  <line x1="812" y1="657" x2="1008" y2="747" class="x"/><line x1="1008" y1="657" x2="812" y2="747" class="x"/>
  <text x="812" y="770" class="t b">Pan de molde 400 g</text>
  <rect x="812" y="780" width="100" height="22" rx="11" class="tag"/><text x="822" y="796" class="s">✓ Sin gluten</text>
  <rect x="918" y="780" width="92" height="22" rx="11" class="tag"/><text x="926" y="796" class="s">✓ Ecológico</text>
  <text x="812" y="822" class="s">Harina de arroz y trigo</text>
  <text x="812" y="838" class="s">sarraceno.</text>
  <text x="812" y="860" class="t b">3,60 €</text>
  <text x="812" y="878" class="xs">Ficha no disponible en el prototipo</text>
  <text x="812" y="890" class="xs">Disponible</text>

  <!-- PAGINACIÓN -->
  <rect x="440" y="930" width="100" height="40" rx="6" class="box"/>
  <text x="458" y="955" class="t">‹ Anterior</text>
  <rect x="555" y="930" width="40" height="40" rx="6" class="dark"/>
  <text x="570" y="956" class="w">1</text>
  <text x="547" y="988" class="xs">(página actual)</text>
  <rect x="605" y="930" width="40" height="40" rx="6" class="box"/>
  <text x="620" y="956" class="t">2</text>
  <rect x="655" y="930" width="40" height="40" rx="6" class="box"/>
  <text x="670" y="956" class="t">3</text>
  <rect x="710" y="930" width="110" height="40" rx="6" class="box"/>
  <text x="725" y="955" class="t">Siguiente ›</text>

  <!-- FOOTER -->
  <rect x="40" y="1030" width="1000" height="110" class="soft"/>
  <text x="80" y="1065" class="t b">⚠ Prototipo educativo: no se realizan compras ni envíos reales.</text>
  <text x="80" y="1095" class="t">Inicio · Catálogo · Carrito · Acceder</text>
  <text x="80" y="1122" class="s">© 2026 VitaMarket · Práctica DAW</text>

  <!-- ANOTACIONES -->
  <g>
    <circle cx="1075" cy="88" r="12" class="num"/><text x="1071" y="93" class="numt">1</text>
    <text x="1095" y="85" class="note">Misma navegación. Ahora la página actual</text>
    <text x="1095" y="102" class="note">es "Catálogo" (negrita + subrayado).</text>
  </g>
  <g>
    <circle cx="1075" cy="245" r="12" class="num"/><text x="1071" y="250" class="numt">2</text>
    <text x="1095" y="242" class="note">Buscador con etiqueta visible (el ejemplo</text>
    <text x="1095" y="259" class="note">no sustituye a la etiqueta) y botón "Buscar".</text>
  </g>
  <g>
    <circle cx="1075" cy="298" r="12" class="num"/><text x="1071" y="303" class="numt">3</text>
    <text x="1095" y="295" class="note">Aviso obligatorio junto a las herramientas.</text>
  </g>
  <g>
    <circle cx="1075" cy="420" r="12" class="num"/><text x="1071" y="425" class="numt">4</text>
    <text x="1095" y="417" class="note">Filtros agrupados con fieldset y legend:</text>
    <text x="1095" y="434" class="note">casillas (dieta), select (categoría) y</text>
    <text x="1095" y="451" class="note">radio (precio). Viene de los perfiles.</text>
  </g>
  <g>
    <circle cx="1075" cy="850" r="12" class="num"/><text x="1071" y="855" class="numt">5</text>
    <text x="1095" y="847" class="note">"Aplicar filtros" y "Buscar" serán</text>
    <text x="1095" y="864" class="note">&lt;button type="button"&gt;: no recargan.</text>
  </g>
  <g>
    <circle cx="1075" cy="355" r="12" class="num"/><text x="1071" y="360" class="numt">6</text>
    <text x="1095" y="352" class="note">Resumen de resultados de ejemplo.</text>
  </g>
  <g>
    <circle cx="1075" cy="520" r="12" class="num"/><text x="1071" y="525" class="numt">7</text>
    <text x="1095" y="517" class="note">Grid de 3 columnas flexibles con gap.</text>
    <text x="1095" y="534" class="note">Cada ficha: nombre, imagen, descripción,</text>
    <text x="1095" y="551" class="note">precio y disponibilidad. Interior con Flexbox.</text>
  </g>
  <g>
    <circle cx="1075" cy="600" r="12" class="num"/><text x="1071" y="605" class="numt">8</text>
    <text x="1095" y="597" class="note">Solo la proteína enlaza a detalle.html</text>
    <text x="1095" y="614" class="note">(borde más grueso). Las demás lo indican.</text>
  </g>
  <g>
    <circle cx="1075" cy="950" r="12" class="num"/><text x="1071" y="955" class="numt">9</text>
    <text x="1095" y="947" class="note">Paginación: página actual con fondo oscuro</text>
    <text x="1095" y="964" class="note">+ texto "(página actual)", no solo color.</text>
  </g>
</svg>
