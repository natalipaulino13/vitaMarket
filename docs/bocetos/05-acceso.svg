<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" font-family="Arial, Helvetica, sans-serif">
  <style>
    .box { fill: #ffffff; stroke: #555; stroke-width: 2; }
    .soft { fill: #f2f2f2; stroke: #555; stroke-width: 2; }
    .dark { fill: #555; stroke: #555; stroke-width: 2; }
    .field { fill: #ffffff; stroke: #777; stroke-width: 1.5; }
    .t { fill: #222; font-size: 15px; }
    .s { fill: #444; font-size: 13px; }
    .xs { fill: #666; font-size: 11px; font-style: italic; }
    .h1 { fill: #111; font-size: 28px; font-weight: bold; }
    .h2 { fill: #111; font-size: 19px; font-weight: bold; }
    .b { font-weight: bold; }
    .w { fill: #ffffff; font-size: 15px; font-weight: bold; }
    .link { fill: #222; font-size: 14px; text-decoration: underline; }
    .note { fill: #7a3e9d; font-size: 13px; }
    .num { fill: #7a3e9d; }
    .numt { fill: #ffffff; font-size: 13px; font-weight: bold; }
  </style>

  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="40" y="32" class="h2" font-size="21">Boceto 5 · Acceso (login.html)</text>

  <rect x="40" y="50" width="1000" height="830" class="box"/>

  <!-- HEADER -->
  <rect x="40" y="50" width="1000" height="80" class="soft"/>
  <rect x="60" y="70" width="150" height="40" class="box"/>
  <text x="80" y="96" class="t b">[logo] VitaMarket</text>
  <text x="600" y="96" class="t">Inicio</text>
  <text x="690" y="96" class="t">Catálogo</text>
  <text x="790" y="96" class="t">Carrito (2)</text>
  <text x="910" y="96" class="t b">Acceder</text>
  <line x1="910" y1="103" x2="972" y2="103" stroke="#222" stroke-width="3"/>

  <!-- PASOS -->
  <rect x="60" y="150" width="960" height="40" class="soft"/>
  <text x="80" y="176" class="t">① Carrito   ›</text>
  <text x="200" y="176" class="t b">② Acceso (paso actual)</text>
  <text x="400" y="176" class="t">›   ③ Datos de entrega</text>

  <!-- CAJA DE ACCESO -->
  <rect x="290" y="220" width="500" height="520" rx="10" class="box" stroke-width="3"/>
  <text x="320" y="270" class="h1">Accede a tu cuenta</text>

  <rect x="320" y="290" width="440" height="62" class="soft" stroke-dasharray="6 4"/>
  <text x="335" y="315" class="s b">⚠ Demostración: no hay autenticación real.</text>
  <text x="335" y="337" class="s">No introduzcas tu correo ni contraseñas reales.</text>

  <text x="320" y="390" class="t b">Correo electrónico *</text>
  <rect x="320" y="400" width="440" height="42" class="field"/>
  <text x="332" y="426" class="xs">nombre@ejemplo.com</text>

  <text x="320" y="480" class="t b">Contraseña *</text>
  <rect x="320" y="490" width="440" height="42" class="field"/>
  <text x="332" y="517" class="t">••••••••</text>
  <text x="320" y="552" class="xs">Mínimo 8 caracteres. * Campo obligatorio</text>

  <rect x="320" y="575" width="440" height="48" rx="6" class="dark"/>
  <text x="455" y="605" class="w">Acceder y continuar</text>

  <text x="320" y="660" class="s">¿No tienes cuenta? El registro no está disponible</text>
  <text x="320" y="678" class="s">en esta demostración.</text>
  <text x="320" y="715" class="link">← Volver al carrito</text>

  <!-- FOOTER -->
  <rect x="40" y="770" width="1000" height="110" class="soft"/>
  <text x="80" y="805" class="t b">⚠ Prototipo educativo: no se realizan compras ni envíos reales.</text>
  <text x="80" y="835" class="t">Inicio · Catálogo · Carrito · Acceder</text>
  <text x="80" y="862" class="s">© 2026 VitaMarket · Práctica DAW</text>

  <!-- ANOTACIONES -->
  <g>
    <circle cx="1075" cy="88" r="12" class="num"/><text x="1071" y="93" class="numt">1</text>
    <text x="1095" y="85" class="note">Página actual: "Acceder".</text>
  </g>
  <g>
    <circle cx="1075" cy="170" r="12" class="num"/><text x="1071" y="175" class="numt">2</text>
    <text x="1095" y="167" class="note">Paso 2 de 3 del pedido.</text>
  </g>
  <g>
    <circle cx="1075" cy="320" r="12" class="num"/><text x="1071" y="325" class="numt">3</text>
    <text x="1095" y="317" class="note">Aviso obligatorio: demostración sin</text>
    <text x="1095" y="334" class="note">autenticación real, sin datos reales.</text>
  </g>
  <g>
    <circle cx="1075" cy="430" r="12" class="num"/><text x="1071" y="435" class="numt">4</text>
    <text x="1095" y="427" class="note">Etiquetas visibles asociadas con for/id.</text>
    <text x="1095" y="444" class="note">type="email" y type="password", required.</text>
    <text x="1095" y="461" class="note">El ejemplo es placeholder, no etiqueta.</text>
  </g>
  <g>
    <circle cx="1075" cy="600" r="12" class="num"/><text x="1071" y="605" class="numt">5</text>
    <text x="1095" y="597" class="note">Botón de envío → formulario.html.</text>
    <text x="1095" y="614" class="note">Los campos no tendrán "name": así no</text>
    <text x="1095" y="631" class="note">aparece nada en la URL al enviar.</text>
  </g>
  <g>
    <circle cx="1075" cy="710" r="12" class="num"/><text x="1071" y="715" class="numt">6</text>
    <text x="1095" y="707" class="note">Salida hacia atrás: no es página sin salida.</text>
  </g>
</svg>
